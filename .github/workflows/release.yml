name: Publish to PyPI

# commux is Linux-only (UCX does not build on macOS), so only Linux wheels are
# produced. Wheels bundle UCX (+gdrcopy) from source for self-containment.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v0.2.0"
        required: true

concurrency:
  group: publish-pypi-${{ github.event.inputs.tag }}
  cancel-in-progress: false

env:
  BUILD_TYPE: Release
  LINUX_ARCH: x86_64
  HOST_PYTHON: "3.11"

defaults:
  run:
    shell: bash

jobs:
  build-linux:
    name: Build Linux Wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag }}

      - name: Setup Host Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.HOST_PYTHON }}
          cache: pip

      - name: Configure Linux build env
        run: |
          PV=${{ matrix.python-version }}
          PV=${PV//./}
          echo "PY_VERSION=$PV" >> $GITHUB_ENV

      - name: Build Linux wheel
        env:
          CIBW_PLATFORM: linux
          # CPU-only wheels: GPU comm (cuda_ipc/gdr_copy) can't be tested on
          # GitHub runners, so we don't ship untested CUDA binaries -- and this
          # drops the multi-GB CUDA toolchain (no disk cleanup needed). GPU users
          # build from source with -C cmake.define.COMMUX_CUDA=ON.
          CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_28_x86_64
          CIBW_BUILD: cp${{ env.PY_VERSION }}*
          CIBW_ARCHS: ${{ env.LINUX_ARCH }}
          CIBW_SKIP: "*musllinux*"
          # commux needs the active torch at build time (find_package(Torch)),
          # installed below -- so build without isolation.
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          CIBW_ENVIRONMENT: >
            PIP_NO_CACHE_DIR=1
            PIP_DISABLE_PIP_VERSION_CHECK=1
            COMMUX_UCX_PROVIDER=bundled
            COMMUX_CUDA=OFF
          CIBW_BEFORE_BUILD: |
            export PATH="/opt/python/cp${{ env.PY_VERSION }}-cp${{ env.PY_VERSION }}/bin:$PATH"
            pip install numpy 'cmake<=3.30' ninja scikit-build-core setuptools-scm patchelf
            pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          # Vendored libs (libcommux + bundled libuc*/libgdrapi) are already
          # repointed to $ORIGIN by commux's install step, so exclude them from
          # auditwheel's vendoring; this just retags to manylinux.
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: |
            auditwheel repair --exclude 'lib*.so*' -w {dest_dir} {wheel}
        run: |
          pip install cibuildwheel
          python -m cibuildwheel --output-dir wheelhouse

      - name: Upload Linux Wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.python-version }}-${{ env.LINUX_ARCH }}
          path: wheelhouse/*.whl

  publish-pypi:
    name: Publish to PyPI
    needs: [build-linux]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: "wheels-*"

      - name: Aggregate into dist/
        run: |
          mkdir -p dist
          find . -name '*.whl' -exec mv {} dist/ \;

      - name: Publish to PyPI
        if: ${{ needs.build-linux.result == 'success' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
